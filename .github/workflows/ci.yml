name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go build and unit tests
        run: |
          go version
          make test-unit

  live-compatibility:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { graylog: '7.2.2', track: production }
          - { graylog: '7.1.12', track: production }
          - { graylog: '7.0.16', track: eol-regression }
          - { graylog: '6.3.15', track: eol-regression }
          - { graylog: '6.2.14', track: eol-regression }
          - { graylog: '6.1.16', track: eol-regression }
          - { graylog: '6.0.14', track: eol-regression }
          - { graylog: '5.2.12', track: eol-regression }
    name: Live compatibility (${{ matrix.track }}, Graylog ${{ matrix.graylog }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false
      - name: Integration tests
        env:
          TIMEOUT: 40m
        run: |
          docker version
          docker compose version
          make test-integration-one GRAYLOG_VERSION=${{ matrix.graylog }} TIMEOUT=$TIMEOUT
      - name: Acceptance tests
        env:
          TIMEOUT: 40m
        run: |
          make test-acc-one GRAYLOG_VERSION=${{ matrix.graylog }} TIMEOUT=$TIMEOUT

  migration:
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false
      - name: Run state migration test (5→6→7)
        env:
          TIMEOUT: 60m
        run: |
          terraform version
          docker version
          docker compose version
          make test-migration
